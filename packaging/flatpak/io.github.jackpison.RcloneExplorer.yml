# Flatpak of Rclone Explorer, built from this checkout:
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.jackpison.RcloneExplorer.yml
# For Flathub, the release workflow writes a copy whose app source is the git
# tag of the release instead of this folder (see packaging/flatpak/README.md).
app-id: io.github.jackpison.RcloneExplorer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: rclone-explorer
finish-args:
  - --share=network # the cloud services rclone talks to
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Transfers and mirrors read and write folders the user picks anywhere in
  # their home folder, including ones chosen by typing a path, so the file
  # chooser portal alone is not enough.
  - --filesystem=home
  # rclone's own configuration with the user's remotes, shared with an rclone
  # installed on the system
  - --filesystem=xdg-config/rclone:create
  # the tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # the chime when a transfer finishes (played with paplay or pw-play)
  - --socket=pulseaudio
modules:
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/bin/rclone
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.zip
        sha256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        x-checker-data:
          type: html
          url: https://downloads.rclone.org/version.txt
          version-pattern: rclone v([\d.]+)
          url-template: https://downloads.rclone.org/v$version/rclone-v$version-linux-amd64.zip
      - type: archive
        only-arches: [aarch64]
        url: https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-arm64.zip
        sha256: ee169016675e23a69d77240565133ff7dbc9b33d16fa8f7053d4af39f1eaeb78
        x-checker-data:
          type: html
          url: https://downloads.rclone.org/version.txt
          version-pattern: rclone v([\d.]+)
          url-template: https://downloads.rclone.org/v$version/rclone-v$version-linux-arm64.zip

  - name: rclone-explorer
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRB_BUILD_TESTS=OFF
      - cmake --build build
      - install -Dm755 build/build/rclone-explorer /app/bin/rclone-explorer
      - install -Dm644 packaging/linux/rclone-explorer.desktop /app/share/applications/io.github.jackpison.RcloneExplorer.desktop
      - desktop-file-edit --set-icon=io.github.jackpison.RcloneExplorer --set-key=StartupWMClass --set-value=io.github.jackpison.RcloneExplorer /app/share/applications/io.github.jackpison.RcloneExplorer.desktop
      - install -Dm644 packaging/linux/rclone-explorer.png /app/share/icons/hicolor/256x256/apps/io.github.jackpison.RcloneExplorer.png
      - python3 packaging/linux/metainfo.py "$(head -1 VERSION | tr -d '[:space:]')" /app/share/metainfo/io.github.jackpison.RcloneExplorer.metainfo.xml io.github.jackpison.RcloneExplorer.desktop
      - install -d /app/share/rclone-browser/icons/remotes
      - install -m644 icons/remotes/*.png /app/share/rclone-browser/icons/remotes/
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
